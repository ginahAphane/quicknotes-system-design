<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Simple notes with JSONPlaceholder API</p>
  </header>

  <main>
    <section>
      <button id="load-btn">Load Notes</button>
      <p id="status" role="status"></p>
    </section>

    <section>
      <h2>Create Note</h2>
      <form id="note-form">
        <div>
          <label for="title-input">Title *</label>
          <input type="text" id="title-input" maxlength="100" placeholder="Max 100 chars" required>
        </div>
        <div>
          <label for="body-input">Body</label>
          <textarea id="body-input" rows="4" placeholder="Write your note..."></textarea>
        </div>
        <button type="submit" id="submit-btn">Save Note</button>
      </form>
    </section>

    <section>
      <h2>Your Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
